function renderAllStudentsTable(){$('allStudentTableContainer').innerHTML=table(state.students)}function renderClassTables(){['Beginner','Intermediate','Advance'].forEach(s=>{$(`class${s}TableContainer`).innerHTML=table(state.students.filter(x=>x.section===s))})}
function renderPromoDemo(){const q=($('promoSearchInput').value||'').toLowerCase(),list=state.students.filter(s=>s.userId.toLowerCase().includes(q)||`${s.firstName} ${s.lastName}`.toLowerCase().includes(q));$('promoDemoContainer').innerHTML=list.map(s=>`<div class="promo-card"><div class="promo-info"><h4>${esc(s.firstName)} ${esc(s.lastName)} (${esc(s.userId)})</h4><p>Ajin yanzu: <b>${esc(s.section)}</b></p></div><div><button onclick="promoteStudent(decodeURIComponent('${encodeURIComponent(s.userId)}'))">Promote ➔</button><button onclick="demoteStudent(decodeURIComponent('${encodeURIComponent(s.userId)}'))">⬅ Demote</button></div></div>`).join('')||'<p>Babu sakamako.</p>'}
async function promoteStudent(id){const s=state.students.find(x=>x.userId===id);if(!s||s.section==='Advance')return;const section=s.section==='Beginner'?'Intermediate':'Advance';const {error}=await supabaseClient.from('students').update({section}).eq('id',s.id);if(error)return alert(error.message);await loadDashboardData()}async function demoteStudent(id){const s=state.students.find(x=>x.userId===id);if(!s||s.section==='Beginner')return;const section=s.section==='Advance'?'Intermediate':'Beginner';const {error}=await supabaseClient.from('students').update({section}).eq('id',s.id);if(error)return alert(error.message);await loadDashboardData()}
function renderCodesEngines(){['Beginner','Intermediate','Advance'].forEach(sec=>{const level=sec.toLowerCase(),list=state.codes.filter(c=>c.level===level);$(`countBadge${sec}`).innerText=`${list.filter(c=>!c.is_used).length} active / ${list.length} total`;$(`listEngine${sec}`).innerHTML=list.map(c=>`<div style="padding:4px 8px;font-family:monospace"><span style="${c.is_used?'text-decoration:line-through;color:#94a3b8':'font-weight:bold'}">${esc(c.code)}</span> — ${c.is_used?'Used':'Active'}</div>`).join('')||'<p>Babu code.</p>'})}
async function generateCodesForClass(sec){const level=sec.toLowerCase(),prefix=sec==='Beginner'?'bgr_':sec==='Intermediate'?'itm_':'adv_';const rows=Array.from({length:20},()=>({code:prefix+crypto.randomUUID().replaceAll('-','').slice(0,5),level,is_used:false}));const {error}=await supabaseClient.from('codes').insert(rows);if(error)return alert(error.message);await loadDashboardData()}async function copyAllCodes(sec){const level=sec.toLowerCase(),t=state.codes.filter(c=>c.level===level&&!c.is_used).map(c=>c.code).join('\n');if(!t)return alert('Babu active codes.');await navigator.clipboard.writeText(t);alert('An kwafe codes.')}async function deleteAllCodes(sec){if(!confirm('Tabbas ka goge active codes?'))return;const {error}=await supabaseClient.from('codes').delete().eq('level',sec.toLowerCase()).eq('is_used',false);if(error)return alert(error.message);await loadDashboardData()}
