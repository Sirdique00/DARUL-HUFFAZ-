name: Darul Huffaz Frontend Verification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify Supabase source of truth
        env:
          SUPABASE_URL: https://jdjxlfaabzxmwbgxduwr.supabase.co
          SUPABASE_KEY: sb_publishable_9s82QdwtrnBiaF-lVyLH1A_N0zTn46-
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const\s+SUPABASE_URL\s*=\s*['\"][^'\"]+['\"];", "const SUPABASE_URL = '"+os.environ['SUPABASE_URL']+"';", s)
          s=re.sub(r"const\s+SUPABASE_PUBLISHABLE_KEY\s*=\s*['\"][^'\"]+['\"];", "const SUPABASE_PUBLISHABLE_KEY = '"+os.environ['SUPABASE_KEY']+"';", s)

          old_camera = """          function openLiveCamera(){ $('cameraModal').style.display='flex'; startCameraStream(); }
          function startCameraStream(){ if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop()); navigator.mediaDevices.getUserMedia({video:{facingMode:usingFrontCamera?'user':'environment'},audio:false}).then(s=>{mediaStream=s;$('liveVideoElement').srcObject=s;}).catch(e=>{alert('An samu matsala wajen bude camera: '+e.message);$('cameraModal').style.display='none';}); }"""
          new_camera = """          async function openLiveCamera(){
              $('cameraModal').style.display='flex';
              const ok=await startCameraStream();
              if(!ok)$('cameraModal').style.display='none';
          }
          async function startCameraStream(){
              if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
              const video=$('liveVideoElement');
              if(!navigator.mediaDevices?.getUserMedia){
                  alert('Wannan browser baya bada damar Live Camera. Yi amfani da Chrome ko browser mai HTTPS.');
                  return false;
              }
              video.pause(); video.srcObject=null;
              const wanted=usingFrontCamera?'user':'environment';
              try{
                  mediaStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:wanted},width:{ideal:1280},height:{ideal:960}},audio:false});
              }catch(e){
                  try{mediaStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:wanted},audio:false});}
                  catch(e2){mediaStream=null;alert('An kasa bude Camera. Ka tabbatar ka ba browser izinin Camera sannan ka sake gwadawa.');return false;}
              }
              video.srcObject=mediaStream; video.setAttribute('playsinline',''); video.muted=true;
              try{await video.play();}catch(e){}
              return true;
          }"""
          if old_camera not in s:
              raise SystemExit('Camera anchor missing')
          s=s.replace(old_camera,new_camera,1)

          old_camera_controls = """          $('switchCameraBtn').addEventListener('click',()=>{usingFrontCamera=!usingFrontCamera;startCameraStream();});
          $('captureCancelBtn').addEventListener('click',()=>{if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());$('cameraModal').style.display='none';});
          $('captureGoodBtn').addEventListener('click',()=>{const v=$('liveVideoElement'),c=document.createElement('canvas');c.width=v.videoWidth||600;c.height=v.videoHeight||800;c.getContext('2d').drawImage(v,0,0,c.width,c.height);processAndSetImage(c.toDataURL('image/jpeg',0.76));if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());$('cameraModal').style.display='none';});"""
          new_camera_controls = """          $('switchCameraBtn').addEventListener('click',async()=>{
              const btn=$('switchCameraBtn'); btn.disabled=true;
              usingFrontCamera=!usingFrontCamera;
              const ok=await startCameraStream();
              if(!ok)usingFrontCamera=!usingFrontCamera;
              btn.disabled=false;
          });
          $('captureCancelBtn').addEventListener('click',()=>{
              if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
              $('liveVideoElement').srcObject=null; $('cameraModal').style.display='none';
          });
          $('captureGoodBtn').addEventListener('click',()=>{
              const v=$('liveVideoElement');
              if(!mediaStream||!v.videoWidth||!v.videoHeight){alert('Camera bai shirya ba tukuna. Jira kadan sannan ka sake taba Good.');return;}
              const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
              c.getContext('2d').drawImage(v,0,0,c.width,c.height);
              processAndSetImage(c.toDataURL('image/jpeg',0.76));
              if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
              v.srcObject=null; $('cameraModal').style.display='none';
          });"""
          if old_camera_controls not in s:
              raise SystemExit('Camera controls anchor missing')
          s=s.replace(old_camera_controls,new_camera_controls,1)

          old_delete = """          $('deleteStudentBtn').addEventListener('click',async()=>{if(!state.selectedStudentId||!confirm('Tabbas kana son goge wannan dalibin?'))return;const s=state.students.find(x=>x.id===state.selectedStudentId);if(!s)return;const {error:pe}=await supabaseClient.from('payments').delete().eq('student_id',s.id);if(pe)return alert(pe.message);const {error}=await supabaseClient.from('students').delete().eq('id',s.id);if(error)return alert(error.message);if(s.passport)await supabaseClient.storage.from('student-passports').remove([s.passport]);await logActivity('delete_student','student',String(s.id),{user_id:s.userId});$('studentModal').style.display='none';await loadDashboardData();});"""
          new_delete = """          $('deleteStudentBtn').addEventListener('click',async()=>{
              if(!state.selectedStudentId||!confirm('Tabbas kana son goge wannan dalibin?'))return;
              const s=state.students.find(x=>x.id===state.selectedStudentId); if(!s)return;
              const btn=$('deleteStudentBtn'); btn.disabled=true; btn.innerText='Ana gogewa...';
              try{
                  const {data,error}=await supabaseClient.functions.invoke('delete-student',{body:{studentId:s.id}});
                  if(error)throw error;
                  if(!data?.success)throw new Error(data?.error||'DELETE_STUDENT_FAILED');
                  $('studentModal').style.display='none'; state.selectedStudentId=null; await loadDashboardData();
                  if(data.storageWarning)alert('An goge dalibin, amma an samu matsala wajen share hoton: '+data.storageWarning);
              }catch(err){console.error(err);alert('An kasa goge dalibin: '+(err.message||err));}
              finally{btn.disabled=false;btn.innerText='🗑️ Delete';}
          });"""
          if old_delete not in s:
              raise SystemExit('Delete anchor missing')
          s=s.replace(old_delete,new_delete,1)

          realtime = r'''          let realtimeChannel = null;
          let realtimeRefreshTimer = null;
          function scheduleRealtimeRefresh(){
              clearTimeout(realtimeRefreshTimer);
              realtimeRefreshTimer=setTimeout(()=>loadDashboardData(),250);
          }
          function setupSupabaseRealtime(){
              if(realtimeChannel) return realtimeChannel;
              realtimeChannel=supabaseClient.channel('darul-huffaz-realtime')
                  .on('postgres_changes',{event:'*',schema:'public',table:'students'},scheduleRealtimeRefresh)
                  .on('postgres_changes',{event:'*',schema:'public',table:'codes'},scheduleRealtimeRefresh)
                  .on('postgres_changes',{event:'*',schema:'public',table:'notices'},scheduleRealtimeRefresh)
                  .on('postgres_changes',{event:'*',schema:'public',table:'payments'},scheduleRealtimeRefresh)
                  .on('postgres_changes',{event:'*',schema:'public',table:'admin_profiles'},scheduleRealtimeRefresh)
                  .on('postgres_changes',{event:'*',schema:'public',table:'activity_logs'},scheduleRealtimeRefresh)
                  .subscribe((status,error)=>{
                      if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){
                          console.warn('Supabase Realtime:',error||status);
                          realtimeChannel=null;
                          setTimeout(()=>setupSupabaseRealtime(),2000);
                      }
                  });
              return realtimeChannel;
          }
          '''
          if 'function setupSupabaseRealtime()' not in s:
              marker='          async function loadDashboardData(){'
              if marker not in s: raise SystemExit('Realtime insertion anchor missing')
              s=s.replace(marker,realtime+'\n'+marker,1)
          old="const admin=await ensureAdmin();if(!admin){await supabaseClient.auth.signOut({scope:'local'});return showPage('welcomePage');}"
          new=old+"setupSupabaseRealtime();"
          if 'setupSupabaseRealtime();' not in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "const SUPABASE_URL = 'https://jdjxlfaabzxmwbgxduwr.supabase.co';" index.html
          grep -q "const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_9s82QdwtrnBiaF-lVyLH1A_N0zTn46-';" index.html
          grep -q "function setupSupabaseRealtime()" index.html
          grep -q "delete-student" index.html
          grep -q "facingMode:{exact:wanted}" index.html
          for t in students codes notices payments admin_profiles activity_logs; do grep -q "table:'$t'" index.html; done
          if grep -q "sb_publishable__XP-1m___1AaPk8gbfCkyA_NA-87Tjw" index.html; then exit 1; fi
          if grep -nE "localStorage|sessionStorage|__dhMemoryStorage" index.html; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/darul-huffaz-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/darul-huffaz-inline.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Harden camera and student deletion'
            git push
          fi
