function startBalloonsAndConfetti(){const b=$('balloonsContainer'),c=$('confettiContainer');if(!b||!c)return;b.innerHTML='';c.innerHTML='';for(let i=0;i<10;i++){const x=document.createElement('div');x.className='balloon';x.style.left=Math.random()*90+'%';x.style.backgroundColor=['#ef4444','#fbbf24','#10b981'][i%3];b.appendChild(x)}for(let i=0;i<20;i++){const x=document.createElement('div');x.className='confetti';x.style.left=Math.random()*100+'%';x.style.backgroundColor=['#f59e0b','#10b981','#ef4444'][i%3];c.appendChild(x)}}
