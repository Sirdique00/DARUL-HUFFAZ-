$('openSourceSelectBtn').addEventListener('click',()=>{$('sourceSelectModal').style.display='flex'});$('choiceCancelBtn').addEventListener('click',()=>{$('sourceSelectModal').style.display='none'});$('choiceGalleryBtn').addEventListener('click',()=>{$('sourceSelectModal').style.display='none';$('galleryInput').click()});$('choiceCameraBtn').addEventListener('click',()=>{$('sourceSelectModal').style.display='none';openLiveCamera()});$('switchCameraBtn').addEventListener('click',()=>{usingFrontCamera=!usingFrontCamera;openLiveCamera()});$('captureCancelBtn').addEventListener('click',()=>{if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());$('cameraModal').style.display='none'});$('captureGoodBtn').addEventListener('click',()=>{const v=$('liveVideoElement'),c=document.createElement('canvas');c.width=v.videoWidth||600;c.height=v.videoHeight||800;c.getContext('2d').drawImage(v,0,0,c.width,c.height);processImage(c.toDataURL('image/jpeg',.82));if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());$('cameraModal').style.display='none'});
