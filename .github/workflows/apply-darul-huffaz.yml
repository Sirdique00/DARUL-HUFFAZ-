function renderMonthlyRevenue(payments){const now=new Date(),names=['January','February','March','April','May','June','July','August','September','October','November','December'],cur={Beginner:0,Intermediate:0,Advance:0},map={};for(const p of payments){const d=new Date(p.paid_at),s=state.students.find(x=>x.id===p.student_id),sec=s?.section||'Advance',k=`${names[d.getMonth()]} ${d.getFullYear()}`;map[k]??={Beginner:0,Intermediate:0,Advance:0,total:0};map[k][sec]+=Number(p.amount||0);map[k].total+=Number(p.amount||0);if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())cur[sec]+=Number(p.amount||0)}$('curBeginnerRev').innerText=money(cur.Beginner);$('curIntermediateRev').innerText=money(cur.Intermediate);$('curAdvanceRev').innerText=money(cur.Advance);$('curAllRev').innerText=money(cur.Beginner+cur.Intermediate+cur.Advance);$('monthlyArchivesListContainer').innerHTML=Object.entries(map).map(([k,v])=>`<div style="padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:8px"><b>${esc(k)}</b><div>Beginner: ${money(v.Beginner)} | Intermediate: ${money(v.Intermediate)} | Advance: ${money(v.Advance)} | <b>All: ${money(v.total)}</b></div></div>`).join('')||'<p>Babu bayanan revenue.</p>';if($('currentMonthTitleHeading'))$('currentMonthTitleHeading').innerText=`Watan da ake ciki: ${names[now.getMonth()]} ${now.getFullYear()}`}
