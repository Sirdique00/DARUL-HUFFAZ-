name: Darul Huffaz Frontend Verification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current Supabase configuration
        env:
          SUPABASE_URL: https://jdjxlfaabzxmwbgxduwr.supabase.co
          SUPABASE_KEY: sb_publishable_9s82QdwtrnBiaF-lVyLH1A_N0zTn46-
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const\s+SUPABASE_URL\s*=\s*['\"][^'\"]+['\"];", "const SUPABASE_URL = '"+os.environ['SUPABASE_URL']+"';", s)
          s=re.sub(r"const\s+SUPABASE_PUBLISHABLE_KEY\s*=\s*['\"][^'\"]+['\"];", "const SUPABASE_PUBLISHABLE_KEY = '"+os.environ['SUPABASE_KEY']+"';", s)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "const SUPABASE_URL = 'https://jdjxlfaabzxmwbgxduwr.supabase.co';" index.html
          grep -q "const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_9s82QdwtrnBiaF-lVyLH1A_N0zTn46-';" index.html
          if grep -q "sb_publishable__XP-1m___1AaPk8gbfCkyA_NA-87Tjw" index.html; then exit 1; fi
          if grep -nE "localStorage|sessionStorage|__dhMemoryStorage" index.html; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Apply current Supabase frontend configuration'
            git push
          fi
