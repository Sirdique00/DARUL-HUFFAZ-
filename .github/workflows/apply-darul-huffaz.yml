function processImage(src){const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,900/img.width,1100/img.height);c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);tempPassportBase64=c.toDataURL('image/jpeg',.82);$('passportPreviewImg').src=tempPassportBase64};img.src=src}
