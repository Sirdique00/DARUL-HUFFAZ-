$('logoutBtn').addEventListener('click',async()=>{await supabaseClient.auth.signOut({scope:'local'});showPage('welcomePage')});
document.querySelectorAll('.sidebar-menu li[data-tab]').forEach(li=>li.addEventListener('click',()=>switchTab(li.dataset.tab,li)));function switchTab(id,el){document.querySelectorAll('.dash-section').forEach(s=>s.classList.remove('active-tab'));document.querySelectorAll('.sidebar-menu li[data-tab]').forEach(l=>l.classList.remove('active'));$(id)?.classList.add('active-tab');el?.classList.add('active');$('appSidebar').classList.remove('sidebar-open');loadDashboardData()}$('toggleSidebarBtn').addEventListener('click',e=>{e.stopPropagation();$('appSidebar').classList.toggle('sidebar-open')});
async function loadDashboardData(){try{if(!await admin()){await supabaseClient.auth.signOut({scope:'local'});return showPage('welcomePage')}await load();const {data:pay,error}=await supabaseClient.from('payments').select('amount,paid_at,status,student_id').eq('status','paid');if(error)throw error;const total=(pay||[]).reduce((a,p)=>a+Number(p.amount||0),0);$('statTotalStudents').innerText=state.students.length;$('statTotalRevenue').innerText=money(total);$('badgeAllStudents').innerText=state.students.length;$('badgeBeginner').innerText=state.students.filter(s=>s.section==='Beginner').length;$('badgeIntermediate').innerText=state.students.filter(s=>s.section==='Intermediate').length;$('badgeAdvance').innerText=state.students.filter(s=>s.section==='Advance').length;renderAllStudentsTable();renderClassTables();renderFormsList();renderCodesEngines();renderNotices();renderPromoDemo();renderMonthlyRevenue(pay||[])}catch(e){console.error(e);alert('An kasa loda dashboard: '+e.message)}}
