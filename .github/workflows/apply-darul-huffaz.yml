          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          start=html.find('<script>\n// Supabase credentials')
          if start < 0:
              start=html.find('<script>\r\n// Supabase credentials')
          if start < 0:
              raise SystemExit('Legacy script marker not found')
          end=html.find('</script>', start)
          if end < 0:
              raise SystemExit('Legacy script end not found')
          js=r'''<script>
const SUPABASE_URL='https://jdjxlfaabzxmwbgxduwr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable__XP-1m___1AaPk8gbfCkyA_NA-87Tjw';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
