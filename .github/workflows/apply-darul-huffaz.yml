async function admin(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user)return null;const {data,error}=await supabaseClient.from('admin_profiles').select('*').eq('auth_user_id',user.id).eq('is_active',true).maybeSingle();if(error)throw error;return data}
