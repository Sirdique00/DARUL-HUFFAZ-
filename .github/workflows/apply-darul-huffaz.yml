name: Apply Darul Huffaz Supabase migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[supabase-migration]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
