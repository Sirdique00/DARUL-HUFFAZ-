name: Final Darul Huffaz Repair
on:
  push:
    paths:
      - '.github/workflows/final-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("maxW=900,maxH=1100", "maxW=720,maxH=900")
          s=s.replace("toDataURL('image/jpeg',0.82)", "toDataURL('image/jpeg',0.76)")
          s=s.replace("select('amount,paid_at,status')", "select('student_id,amount,paid_at,status')")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify complete frontend
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            "https://jdjxlfaabzxmwbgxduwr.supabase.co",
            "sb_publishable_9s82QdwtrnBiaF-lVyLH1A_N0zTn46-",
            "persistSession: false",
            "supabaseClient.functions.invoke('register-student'",
            "supabaseClient.functions.invoke('bootstrap-admin'",
            "from('students')",
            "from('codes')",
            "from('notices')",
            "from('payments')",
            "student-passports",
            "generateCodesForClass",
            "promoteStudent",
            "demoteStudent",
            "openStudentModal",
            "openAdminFormView",
            "renderNotices",
            "startBalloonsAndConfetti",
            "openLiveCamera"
          ]
          for x in required: assert x in s, 'missing required feature: '+x
          for bad in ('localStorage','sessionStorage','__dhMemoryStorage','sb_publishable__XP-1m___1AaPk8gbfCkyA_NA-87Tjw','aobizjaqoctzbmzmpvrz.supabase.co'):
            assert bad not in s, 'legacy reference remains: '+bad
          assert "select('student_id,amount,paid_at,status')" in s
          ids=set(re.findall(r'id=[\"\']([^\"\']+)[\"\']',s))
          used=set(re.findall(r"\$\(['\"]([^'\"]+)['\"]\)",s)) | set(re.findall(r"getElementById\(['\"]([^'\"]+)['\"]\)",s))
          missing=sorted(x for x in used if x not in ids)
          if missing: raise SystemExit('Missing DOM ids: '+', '.join(missing))
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit repaired frontend
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Finalize Darul Huffaz frontend repairs'; git push; fi
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/final-repair.yml
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'Remove temporary final repair workflow'; git push; fi
