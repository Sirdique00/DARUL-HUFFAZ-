name: Fix registration code generator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install robust Supabase code generator UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* DH_SUPABASE_CODE_GENERATOR_V2 */'
          if marker in s:
              a=s.index('<script>\\n'+marker)
              b=s.index('</script>',a)+len('</script>')
              s=s[:a]+s[b:]
          script=r'''<script>
          /* DH_SUPABASE_CODE_GENERATOR_V2 */
          (()=>{
            const $=id=>document.getElementById(id);
            let historyBusy=false;
            const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            function isCodeArea(){
              const txt=(document.body.innerText||'').toLowerCase();
              return txt.includes('generate code')||txt.includes('generate codes')||txt.includes('codes')||txt.includes('registration code');
            }
            function findGenerateButton(){
              const preferred=['generateCodesBtn','generateCodeBtn','generateCodeButton','createCodeBtn'];
              for(const id of preferred){const el=$(id);if(el)return el;}
              return [...document.querySelectorAll('button')].find(b=>/generate\\s*(registration\\s*)?codes?|generate\\s*code|create\\s*code/i.test((b.innerText||b.textContent||'').trim()));
            }
            function ensurePanel(btn){
              let panel=$('dhCodeGeneratorPanel'); if(panel)return panel;
              panel=document.createElement('div');panel.id='dhCodeGeneratorPanel';
              panel.style.cssText='margin:18px 0;padding:18px;border:1px solid #e2e8f0;border-radius:14px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.05)';
              panel.innerHTML=`<div style="font-weight:800;color:#064e3b;font-size:18px;margin-bottom:12px">🔐 Registration Codes</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <label style="font-size:13px;font-weight:700">Number of codes<input id="dhCodeCount" type="number" min="1" max="100" value="10" style="width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #cbd5e1;border-radius:8px"></label>
                <label style="font-size:13px;font-weight:700">Level<select id="dhCodeLevel" style="width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #cbd5e1;border-radius:8px"><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advance">Advance</option></select></label>
              </div>
              <div id="dhCodeResult" style="margin-top:12px"></div>
              <div style="display:flex;gap:8px;margin-top:12px"><button type="button" id="dhRefreshCodes" style="flex:1">🔄 Refresh History</button><button type="button" id="dhCopyCodes" style="flex:1">📋 Copy New Codes</button></div>
              <div id="dhCodeHistory" style="margin-top:14px;overflow:auto"></div>`;
              btn.parentNode.insertBefore(panel,btn.nextSibling);
              $('dhRefreshCodes').onclick=()=>loadHistory();
              $('dhCopyCodes').onclick=()=>{const box=$('dhCodeResult');const text=[...box.querySelectorAll('[data-code]')].map(x=>x.dataset.code).join('\\n');if(text)navigator.clipboard?.writeText(text).then(()=>alert('An kwafe sabbin codes.'));};
              return panel;
            }
            async function generate(btn){
              const panel=ensurePanel(btn),count=Math.min(100,Math.max(1,Number($('dhCodeCount').value||10))),level=$('dhCodeLevel').value;
              const result=$('dhCodeResult');btn.disabled=true;btn.dataset.oldText=btn.innerText;btn.innerText='Ana generating...';result.innerHTML='<div style="padding:10px;color:#64748b">Ana samar da codes a Supabase...</div>';
              try{
                const {data,error}=await supabaseClient.functions.invoke('generate-registration-codes',{body:{count,level}});
                if(error)throw error;if(!data?.success)throw new Error(data?.error||'GENERATION_FAILED');
                result.innerHTML=`<div style="font-weight:800;color:#047857;margin-bottom:8px">✅ An samar da ${data.count} ${esc(level)} code(s).</div><div style="display:grid;gap:6px">${(data.codes||[]).map(x=>`<div data-code="${esc(x.code)}" style="font-family:monospace;font-weight:800;padding:9px 11px;border:1px solid #d1fae5;border-radius:8px;background:#f0fdf4">${esc(x.code)} <span style="float:right;font-family:inherit;font-weight:600;color:#64748b">UNUSED</span></div>`).join('')}</div>`;
                await loadHistory();
              }catch(e){console.error(e);result.innerHTML=`<div style="padding:10px;border-radius:8px;background:#fef2f2;color:#b91c1c">❌ An kasa generating: ${esc(e?.message||e)}</div>`;}
              finally{btn.disabled=false;btn.innerText=btn.dataset.oldText||'Generate Code';}
            }
            async function loadHistory(){
              if(historyBusy||!window.supabaseClient)return;historyBusy=true;
              try{
                const {data,error}=await supabaseClient.from('codes').select('id,code,level,is_used,used_by,used_at,created_at').order('created_at',{ascending:false}).limit(500);
                if(error)throw error;const box=$('dhCodeHistory');if(!box)return;
                box.innerHTML=`<div style="font-weight:800;margin-bottom:8px;color:#0f172a">Code History (${data?.length||0})</div><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:left;padding:7px;border-bottom:1px solid #e2e8f0">Code</th><th style="padding:7px;border-bottom:1px solid #e2e8f0">Level</th><th style="padding:7px;border-bottom:1px solid #e2e8f0">Status</th><th style="padding:7px;border-bottom:1px solid #e2e8f0">Used At</th><th style="padding:7px;border-bottom:1px solid #e2e8f0">Created</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td style="padding:7px;border-bottom:1px solid #f1f5f9;font-family:monospace;font-weight:700">${esc(x.code)}</td><td style="padding:7px;text-align:center;border-bottom:1px solid #f1f5f9">${esc(x.level)}</td><td style="padding:7px;text-align:center;border-bottom:1px solid #f1f5f9;font-weight:800">${x.is_used?'USED':'UNUSED'}</td><td style="padding:7px;border-bottom:1px solid #f1f5f9">${x.used_at?esc(new Date(x.used_at).toLocaleString()):'—'}</td><td style="padding:7px;border-bottom:1px solid #f1f5f9">${esc(new Date(x.created_at).toLocaleString())}</td></tr>`).join('')}</tbody></table>`;
              }catch(e){console.warn('Code history:',e);}
              finally{historyBusy=false;}
            }
            function bind(){
              const btn=findGenerateButton();if(!btn)return;
              ensurePanel(btn);
              if(btn.dataset.dhCodeV2)return;btn.dataset.dhCodeV2='1';
              btn.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();generate(btn)},true);
              loadHistory();
            }
            const boot=()=>{bind();setTimeout(bind,500);setTimeout(bind,1500);};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
            new MutationObserver(()=>bind()).observe(document.body,{subtree:true,childList:true});
            window.addEventListener('load',bind);
          })();
          </script>'''
          s=s.replace('</body>',script+'\\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/dh.js').write_text('\\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/dh.js
          grep -q 'DH_SUPABASE_CODE_GENERATOR_V2' index.html
          grep -q 'generate-registration-codes' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Supabase registration code generator and permanent history'
            git push
          fi