name: Darul Huffaz Admin Auth Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Supabase admin credentials flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* DH_SUPABASE_ADMIN_AUTH_V1 */'
          if marker in s:
              print('Admin auth already installed')
              raise SystemExit(0)
          inject=r'''/* DH_SUPABASE_ADMIN_AUTH_V1 */
          (()=>{
              const login=$('loginPage');
              if(!login)return;
              const pass=$('adminPass');
              if(!pass)return;
              const pinWrap=document.createElement('div');
              pinWrap.className='form-group';
              pinWrap.innerHTML='<label>Admin PIN *</label><input type="password" id="adminLoginPin" inputmode="numeric" maxlength="8" placeholder="4–8 digit PIN" autocomplete="off">';
              pass.parentNode.insertAdjacentElement('afterend',pinWrap);
              const userLabel=$('adminUser').previousElementSibling;
              userLabel.innerText='Username / Admin Email *';
              $('adminUser').placeholder='admin@example.com';
              const oldBtn=$('verifyLoginBtn');
              const btn=oldBtn.cloneNode(true);
              oldBtn.replaceWith(btn);
              async function verifyPin(){
                  const pin=$('adminLoginPin').value.trim();
                  if(!/^\d{4,8}$/.test(pin))throw new Error('PIN dole ya zama lambobi 4 zuwa 8.');
                  const r=await supabaseClient.functions.invoke('verify-admin-pin',{body:{pin}});
                  if(r.error)throw r.error;
                  if(!r.data?.success)throw new Error(r.data?.error||'INVALID_PIN');
              }
              async function bootstrap(email,password,pin){
                  const r=await supabaseClient.functions.invoke('bootstrap-admin',{body:{fullName:email.split('@')[0],username:email,pin}});
                  if(r.error)throw r.error;
                  if(!r.data?.success)throw new Error(r.data?.error||'BOOTSTRAP_FAILED');
              }
              btn.addEventListener('click',async()=>{
                  const email=$('adminUser').value.trim().toLowerCase();
                  const password=$('adminPass').value;
                  const pin=$('adminLoginPin').value.trim();
                  if(!email||!password||!pin)return alert('Sanya Username/Email, Password da PIN.');
                  if(!/^\d{4,8}$/.test(pin))return alert('PIN dole ya zama lambobi 4 zuwa 8.');
                  btn.disabled=true;btn.innerText='Ana tabbatarwa...';
                  try{
                      let signedIn=false;
                      let {error}=await supabaseClient.auth.signInWithPassword({email,password});
                      if(!error){
                          signedIn=true;
                      }else{
                          const sign=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:email.split('@')[0]}}});
                          if(sign.error)throw error;
                          if(!sign.data.session){
                              alert('An kirkiri account. Duba email dinka ka tabbatar, sannan ka dawo ka Login da wannan Username, Password da PIN.');
                              return;
                          }
                          signedIn=true;
                      }
                      if(!signedIn)throw new Error('LOGIN_FAILED');
                      let pinOk=true;
                      const vp=await supabaseClient.functions.invoke('verify-admin-pin',{body:{pin}});
                      if(vp.error||!vp.data?.success)pinOk=false;
                      if(!pinOk){
                          const b=await supabaseClient.functions.invoke('bootstrap-admin',{body:{fullName:email.split('@')[0],username:email,pin}});
                          if(b.error||!b.data?.success)throw new Error('PIN din ba daidai ba ko wannan account ba Admin bane.');
                      }
                      const admin=await ensureAdmin();
                      if(!admin)throw new Error('Wannan account ba Admin bane.');
                      $('adminWelcomeUser').innerText=`Admin: ${admin.full_name}`;
                      setupSupabaseRealtime();
                      showPage('adminDashboard');
                  }catch(err){
                      console.error(err);
                      await supabaseClient.auth.signOut({scope:'local'}).catch(()=>{});
                      alert('Login ya kasa: '+(err.message||err));
                  }finally{
                      btn.disabled=false;btn.innerText='Login ➔';
                  }
              });
              $('adminPass').addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
              $('adminLoginPin').addEventListener('keydown',e=>{if(e.key==='Enter')btn.click();});
          })();
          '''
          close='</script>'
          if close not in s: raise SystemExit('Closing script tag missing')
          s=s.replace(close,inject+'\n'+close,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "DH_SUPABASE_ADMIN_AUTH_V1" index.html
          grep -q "verify-admin-pin" index.html
          grep -q "bootstrap-admin" index.html
          if grep -q "localStorage\|sessionStorage\|__dhMemoryStorage" index.html; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/darul-huffaz-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/darul-huffaz-inline.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Connect admin username password and PIN to Supabase'
            git push
          fi
