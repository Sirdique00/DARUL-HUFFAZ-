name: Harden Darul Huffaz frontend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[supabase-migration]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy browser storage logic
        env:
          SUPABASE_URL: https://jdjxlfaabzxmwbgxduwr.supabase.co
          SUPABASE_KEY: sb_publishable__XP-1m___1AaPk8gbfCkyA_NA-87Tjw
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          js = r'''<script>
          const SUPABASE_URL = 'https://jdjxlfaabzxmwbgxduwr.supabase.co';
          const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable__XP-1m___1AaPk8gbfCkyA_NA-87Tjw';
          const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
              auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
          });
          const state = { students: [], codes: [], notices: [], currentFormFilter: 'ALL', selectedStudentId: null };
          let arabicTapCount = 0, arabicTapTimer = null, tempPassportBase64 = '', mediaStream = null, usingFrontCamera = true;
          const $ = id => document.getElementById(id);
          const esc = v => String(v ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
          const money = n => `₦${Number(n || 0).toLocaleString()}`;
          const normalizeStudent = s => ({
              ...s,
              userId: s.user_id, firstName: s.first_name, lastName: s.last_name,
              usedCode: s.used_code, passport: s.passport_url,
              time: new Date(s.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
              date: new Date(s.created_at).toLocaleDateString(), timestamp: new Date(s.created_at).getTime()
          });

          function showPage(pageId) {
              document.querySelectorAll('.page').forEach(p => { if (!['studentModal','formViewModal','sourceSelectModal'].includes(p.id)) p.classList.remove('active-page'); });
              const page = $(pageId); if (page) page.classList.add('active-page');
              if (pageId === 'adminDashboard') loadDashboardData();
              if (pageId === 'successPage') startBalloonsAndConfetti();
          }
          function handlePinBack(){ $('adminPin').value=''; showPage('welcomePage'); }
          function handleLoginBack(){ $('adminUser').value=''; $('adminPass').value=''; showPage('pinPage'); }

          async function getStudents(){
              const {data,error}=await supabaseClient.from('students').select('*').order('id',{ascending:false});
              if(error) throw error; state.students=(data||[]).map(normalizeStudent); return state.students;
          }
          async function getCodes(){
              const {data,error}=await supabaseClient.from('codes').select('*').order('id',{ascending:false});
              if(error) throw error; state.codes=data||[]; return state.codes;
          }
          async function getNotices(){
              const {data,error}=await supabaseClient.from('notices').select('*').eq('is_active',true).order('id',{ascending:false});
              if(error) throw error; state.notices=data||[]; return state.notices;
          }
          async function ensureAdmin(){
              const {data:{user},error}=await supabaseClient.auth.getUser();
              if(error || !user) return null;
              const {data,error:pe}=await supabaseClient.from('admin_profiles').select('*').eq('auth_user_id',user.id).eq('is_active',true).maybeSingle();
              if(pe) throw pe; return data;
          }
          async function logActivity(action, entityType='', entityId='', details={}){
              try { await supabaseClient.from('activity_logs').insert({action,entity_type:entityType||null,entity_id:entityId||null,details}); } catch(e){ console.warn('activity log',e); }
          }

          function processAndSetImage(dataUrl){
              const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); let w=img.width,h=img.height,maxW=900,maxH=1100; const r=Math.min(1,maxW/w,maxH/h); c.width=Math.max(1,Math.round(w*r)); c.height=Math.max(1,Math.round(h*r)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); tempPassportBase64=c.toDataURL('image/jpeg',0.82); $('passportPreviewImg').src=tempPassportBase64; }; img.src=dataUrl;
          }
          function openLiveCamera(){ $('cameraModal').style.display='flex'; startCameraStream(); }
          function startCameraStream(){ if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop()); navigator.mediaDevices.getUserMedia({video:{facingMode:usingFrontCamera?'user':'environment'},audio:false}).then(s=>{mediaStream=s;$('liveVideoElement').srcObject=s;}).catch(e=>{alert('An samu matsala wajen bude camera: '+e.message);$('cameraModal').style.display='none';}); }
          function populateCertificateData(s){
              $('formCardFirstName').innerText=s.firstName; $('formCardLastName').innerText=s.lastName; $('formCardUserId').innerText=s.userId; $('formCardPhone').innerText=s.phone; $('formCardAddress').innerText=s.address||''; $('formCardEmail').innerText=s.email||'N/A'; $('formCardSection').innerText=s.section||'ONLINE'; $('studentSigLine').innerText=`${s.firstName} ${s.lastName}`; $('formCardDate1').innerText=s.date; $('formCardDate2').innerText=s.date;
              const p=$('formCardPassportBox'); p.innerHTML=s.passportData?`<img src="${s.passportData}" alt="Passport">`:'PHOTO';
              const wa=`Assalamu Alaikum Admin, Ga fom dina na rajista Darul Huffaz:\n\n*Student ID:* ${s.userId}\n*Suna:* ${s.firstName} ${s.lastName}\n*Email:* ${s.email||'N/A'}`; $('whatsappSendBtn').href=`https://wa.me/2347056845435?text=${encodeURIComponent(wa)}`;
          }
          function startBalloonsAndConfetti(){ const b=$('balloonsContainer'),c=$('confettiContainer'); b.innerHTML='';c.innerHTML=''; for(let i=0;i<10;i++){let x=document.createElement('div');x.className='balloon';x.style.left=Math.random()*90+'%';x.style.backgroundColor=['#ef4444','#fbbf24','#10b981'][i%3];b.appendChild(x);} for(let i=0;i<20;i++){let x=document.createElement('div');x.className='confetti';x.style.left=Math.random()*100+'%';x.style.backgroundColor=['#f59e0b','#10b981','#ef4444'][i%3];c.appendChild(x);} }

          $('galleryInput').addEventListener('change',e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=x=>processAndSetImage(x.target.result);r.readAsDataURL(f);}});
          $('openSourceSelectBtn').addEventListener('click',()=>{$('sourceSelectModal').style.display='flex';});
          $('choiceCancelBtn').addEventListener('click',()=>{$('sourceSelectModal').style.display='none';});
          $('choiceGalleryBtn').addEventListener('click',()=>{$('sourceSelectModal').style.display='none';$('galleryInput').click();});
          $('choiceCameraBtn').addEventListener('click',()=>{$('sourceSelectModal').style.display='none';openLiveCamera();});
          $('switchCameraBtn').addEventListener('click',()=>{usingFrontCamera=!usingFrontCamera;startCameraStream();});
          $('captureCancelBtn').addEventListener('click',()=>{if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());$('cameraModal').style.display='none';});
          $('captureGoodBtn').addEventListener('click',()=>{const v=$('liveVideoElement'),c=document.createElement('canvas');c.width=v.videoWidth||600;c.height=v.videoHeight||800;c.getContext('2d').drawImage(v,0,0,c.width,c.height);processAndSetImage(c.toDataURL('image/jpeg',0.82));if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());$('cameraModal').style.display='none';});
          $('phone').addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,11);$('phoneErrorMsg').style.display=this.value.length&&this.value.length<11?'block':'none';});
          $('arabicTitleTrigger').addEventListener('click',()=>{arabicTapCount++;clearTimeout(arabicTapTimer);if(arabicTapCount===5){arabicTapCount=0;showPage('pinPage');}else arabicTapTimer=setTimeout(()=>arabicTapCount=0,800);});
          $('agreeCheck').addEventListener('change',function(){$('rulesNextBtn').style.display=this.checked?'block':'none';});
          $('regForm').addEventListener('submit',e=>{e.preventDefault();if($('phone').value.length!==11)return alert('Lambar waya dole ta zama lamba 11!');if(!tempPassportBase64)return alert('Don Allah ka zabi hoton passport tukuna!');const first=$('firstName').value||'Dalibi';$('whatsappLinkBtn').href=`https://wa.me/2347056845435?text=${encodeURIComponent(`Assalamu Alaikum Admin, Sunana ${first}. Ina son samun Confirmation Code din shiga makaranta.`)}`;showPage('codePage');});

          $('finalizeRegBtn').addEventListener('click',async()=>{
              const btn=$('finalizeRegBtn'); const code=$('confCodeInput').value.trim().toLowerCase(); if(!code)return alert('Sanya Confirmation Code.'); btn.disabled=true; btn.innerText='Ana tabbatarwa...';
              try{
                  const {data,error}=await supabaseClient.functions.invoke('register-student',{body:{firstName:$('firstName').value,lastName:$('lastName').value,age:Number($('age').value),email:$('email').value,gender:$('gender').value,address:$('address').value,phone:$('phone').value,code,passportData:tempPassportBase64}});
                  if(error)throw error; if(!data?.success)throw new Error(data?.error||'REGISTRATION_FAILED');
                  const s=normalizeStudent(data.student); s.passportData=tempPassportBase64; populateCertificateData(s); $('regForm').reset(); tempPassportBase64=''; $('passportPreviewImg').src='young.jpg'; $('confCodeInput').value=''; $('agreeCheck').checked=false; $('rulesNextBtn').style.display='none'; showPage('successPage');
              }catch(err){console.error(err);alert('An kasa kammala rajista: '+(err.message||err));}finally{btn.disabled=false;btn.innerText='Kammala Rajista ✨';}
          });

          $('verifyPinBtn').addEventListener('click',()=>{ $('adminPin').value=''; showPage('loginPage'); });
          $('verifyLoginBtn').addEventListener('click',async()=>{
              const email=$('adminUser').value.trim().toLowerCase(),password=$('adminPass').value.trim(); if(!email||!password)return alert('Sanya Admin Email da Password.'); const btn=$('verifyLoginBtn');btn.disabled=true;
              try{
                  let {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
                  if(error){
                      const sign=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:email.split('@')[0]}}});
                      if(sign.error)throw error;
                      if(!sign.data.session){alert('An kirkiri account. Duba email dinka ka tabbatar, sannan ka sake Login.');return;}
                      const boot=await supabaseClient.functions.invoke('bootstrap-admin',{body:{fullName:email.split('@')[0]}}); if(boot.error)throw boot.error;
                  }
                  const admin=await ensureAdmin(); if(!admin)throw new Error('Wannan account ba Admin bane.'); $('adminWelcomeUser').innerText=`Admin: ${admin.full_name}`;showPage('adminDashboard');
              }catch(err){console.error(err);alert('Login ya kasa: '+(err.message||err));}finally{btn.disabled=false;}
          });

          $('logoutBtn').addEventListener('click',async()=>{await supabaseClient.auth.signOut({scope:'local'});state.students=[];state.codes=[];state.notices=[];showPage('welcomePage');});
          document.querySelectorAll('.sidebar-menu li[data-tab]').forEach(li=>li.addEventListener('click',()=>switchTab(li.dataset.tab,li)));
          function switchTab(id,el){document.querySelectorAll('.dash-section').forEach(s=>s.classList.remove('active-tab'));document.querySelectorAll('.sidebar-menu li[data-tab]').forEach(l=>l.classList.remove('active'));$(id)?.classList.add('active-tab');el?.classList.add('active');$('appSidebar').classList.remove('sidebar-open');loadDashboardData();}
          $('toggleSidebarBtn').addEventListener('click',e=>{e.stopPropagation();$('appSidebar').classList.toggle('sidebar-open');});
          $('noticeBellWrapper').addEventListener('click',e=>{e.stopPropagation();$('noticeDropdown').classList.toggle('show');});
          window.addEventListener('click',e=>{if($('noticeDropdown').classList.contains('show'))$('noticeDropdown').classList.remove('show');if($('appSidebar').classList.contains('sidebar-open')&&!$('appSidebar').contains(e.target)&&e.target!==$('toggleSidebarBtn'))$('appSidebar').classList.remove('sidebar-open');});

          async function loadDashboardData(){
              try{
                  const admin=await ensureAdmin();if(!admin){await supabaseClient.auth.signOut({scope:'local'});return showPage('welcomePage');}
                  await Promise.all([getStudents(),getCodes(),getNotices()]);
                  const payments=await supabaseClient.from('payments').select('amount,paid_at,status').eq('status','paid'); if(payments.error)throw payments.error;
                  const total=(payments.data||[]).reduce((a,p)=>a+Number(p.amount||0),0);
                  $('statTotalStudents').innerText=state.students.length;$('statTotalRevenue').innerText=money(total);
                  $('badgeAllStudents').innerText=state.students.length;$('badgeBeginner').innerText=state.students.filter(s=>s.section==='Beginner').length;$('badgeIntermediate').innerText=state.students.filter(s=>s.section==='Intermediate').length;$('badgeAdvance').innerText=state.students.filter(s=>s.section==='Advance').length;
                  renderMonthlyRevenue(payments.data||[]);renderAllStudentsTable();renderClassTables();renderFormsList();renderCodesEngines();renderNotices();renderPromoDemo();
              }catch(e){console.error(e);alert('An kasa loda dashboard: '+e.message);}
          }
          function renderMonthlyRevenue(payments){const now=new Date(),names=['January','February','March','April','May','June','July','August','September','October','November','December'];$('currentMonthTitleHeading').innerText=`Watan da ake ciki: ${names[now.getMonth()]} ${now.getFullYear()} (Days: ${new Date(now.getFullYear(),now.getMonth()+1,0).getDate()})`;let cur={Beginner:0,Intermediate:0,Advance:0};const map={};for(const p of payments){const d=new Date(p.paid_at),k=`${names[d.getMonth()]} ${d.getFullYear()}`;const s=state.students.find(x=>x.id===p.student_id);const sec=s?.section||'Advance';map[k]??={Beginner:0,Intermediate:0,Advance:0,total:0,days:new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};map[k][sec]+=Number(p.amount||0);map[k].total+=Number(p.amount||0);if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())cur[sec]+=Number(p.amount||0);} $('curBeginnerRev').innerText=money(cur.Beginner);$('curIntermediateRev').innerText=money(cur.Intermediate);$('curAdvanceRev').innerText=money(cur.Advance);$('curAllRev').innerText=money(cur.Beginner+cur.Intermediate+cur.Advance);$('monthlyArchivesListContainer').innerHTML=Object.entries(map).filter(([k])=>k!==`${names[now.getMonth()]} ${now.getFullYear()}`).sort().reverse().map(([k,v])=>`<div style="background:#fff;border:1.5px solid #cbd5e1;border-radius:10px;padding:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div><strong style="color:var(--primary);font-size:15px">${esc(k)} (Days: ${v.days})</strong><div style="font-size:12.5px;color:#475569;margin-top:4px">Beginner: ${money(v.Beginner)} | Intermediate: ${money(v.Intermediate)} | Advance: ${money(v.Advance)}</div></div><div style="background:#f0fdf4;border:1px solid #10b981;padding:6px 14px;border-radius:8px;font-weight:bold;color:#047857">All: ${money(v.total)}</div></div>`).join('')||'<p style="color:#64748b;font-size:13px">Babu tsofaffin watanni da aka adana.</p>';}
          function generateTableHTML(list){if(!list.length)return '<p style="color:#64748b;font-size:13px">Babu dalibai a wannan jerin.</p>';return `<table><thead><tr><th>ID</th><th>Suna</th><th>Aji</th><th>Lambar Waya</th><th>Tarihi</th></tr></thead><tbody>${list.map(s=>`<tr onclick="openStudentModal(decodeURIComponent('${encodeURIComponent(s.userId)}'))"><td><strong style="color:var(--primary)">${esc(s.userId)}</strong></td><td>${esc(s.firstName)} ${esc(s.lastName)}</td><td><span style="font-weight:bold;color:#d97706">${esc(s.section)}</span></td><td>${esc(s.phone)}</td><td>${esc(s.date)}</td></tr>`).join('')}</tbody></table>`;}
          function renderAllStudentsTable(){ $('allStudentTableContainer').innerHTML=generateTableHTML(state.students); }
          function renderClassTables(){for(const sec of ['Beginner','Intermediate','Advance'])$(`class${sec}TableContainer`).innerHTML=generateTableHTML(state.students.filter(s=>s.section===sec));}
          function renderPromoDemo(){const q=($('promoSearchInput').value||'').toLowerCase();const list=state.students.filter(s=>s.userId.toLowerCase().includes(q)||`${s.firstName} ${s.lastName}`.toLowerCase().includes(q));$('promoDemoContainer').innerHTML=list.map(s=>`<div class="promo-card"><div class="promo-info"><h4>${esc(s.firstName)} ${esc(s.lastName)} (${esc(s.userId)})</h4><p>Wanda yake a ajin: <b style="color:var(--primary)">${esc(s.section)}</b></p></div><div style="display:flex;gap:8px"><button type="button" onclick="promoteStudent(decodeURIComponent('${encodeURIComponent(s.userId)}'))" style="background:#10b981;color:#fff;padding:6px 12px;font-size:12px;margin:0;width:auto">Promote ➔</button><button type="button" onclick="demoteStudent(decodeURIComponent('${encodeURIComponent(s.userId)}'))" style="background:#ef4444;color:#fff;padding:6px 12px;font-size:12px;margin:0;width:auto">⬅ Demote</button></div></div>`).join('')||'<p style="color:#64748b;font-size:13px">Babu sakamako.</p>';}
          async function promoteStudent(id){const s=state.students.find(x=>x.userId===id);if(!s)return;if(s.section==='Advance')return alert('Dalibi yana ajin karshe (Advance)!');const section=s.section==='Beginner'?'Intermediate':'Advance';const {error}=await supabaseClient.from('students').update({section}).eq('id',s.id);if(error)return alert(error.message);await logActivity('promote_student','student',String(s.id),{from:s.section,to:section});await loadDashboardData();}
          async function demoteStudent(id){const s=state.students.find(x=>x.userId===id);if(!s)return;if(s.section==='Beginner')return alert('Dalibi yana ajin farko (Beginner)!');const section=s.section==='Advance'?'Intermediate':'Beginner';const {error}=await supabaseClient.from('students').update({section}).eq('id',s.id);if(error)return alert(error.message);await logActivity('demote_student','student',String(s.id),{from:s.section,to:section});await loadDashboardData();}
          $('promoSearchInput').addEventListener('input',renderPromoDemo);$('formsSearchInput').addEventListener('input',renderFormsList);$('liveSearchInput').addEventListener('input',()=>{const q=$('liveSearchInput').value.toLowerCase();$('searchDashboardResult').innerHTML=generateTableHTML(state.students.filter(s=>s.userId.toLowerCase().includes(q)||`${s.firstName} ${s.lastName}`.toLowerCase().includes(q)));});$('allStudentSearchInput').addEventListener('input',()=>{const q=$('allStudentSearchInput').value.toLowerCase();$('allStudentTableContainer').innerHTML=generateTableHTML(state.students.filter(s=>s.userId.toLowerCase().includes(q)||`${s.firstName} ${s.lastName}`.toLowerCase().includes(q)));});

          async function generateCodesForClass(section){const level=section==='Beginner'?'beginner':section==='Intermediate'?'intermediate':'advance';const prefix=section==='Beginner'?'bgr_':section==='Intermediate'?'itm_':'adv_';const rows=Array.from({length:20},()=>({code:prefix+crypto.randomUUID().replaceAll('-','').slice(0,5),level,is_used:false}));const {error}=await supabaseClient.from('codes').insert(rows);if(error)return alert(error.message);await logActivity('generate_codes','codes',null,{section,count:20});await loadDashboardData();}
          async function copyAllCodes(section){const level=section==='Beginner'?'beginner':section==='Intermediate'?'intermediate':'advance';const txt=state.codes.filter(c=>c.level===level&&!c.is_used).map(c=>c.code).join('\n');if(!txt)return alert('Babu active codes.');await navigator.clipboard.writeText(txt);alert(`An kwofance codes na ${section} lami lafiya.`);}
          async function deleteAllCodes(section){if(!confirm(`Tabbas kana son goge dukkan codes na ${section}?`))return;const level=section==='Beginner'?'beginner':section==='Intermediate'?'intermediate':'advance';const {error}=await supabaseClient.from('codes').delete().eq('level',level).eq('is_used',false);if(error)return alert(error.message);await logActivity('delete_active_codes','codes',null,{section});await loadDashboardData();}
          function renderCodesEngines(){for(const sec of ['Beginner','Intermediate','Advance']){const level=sec==='Beginner'?'beginner':sec==='Intermediate'?'intermediate':'advance',list=state.codes.filter(c=>c.level===level);$(`countBadge${sec}`).innerText=`${list.filter(c=>!c.is_used).length} active / ${list.length} total`;$(`listEngine${sec}`).innerHTML=list.map(c=>`<div style="font-family:monospace;font-size:12.5px;padding:4px 8px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between"><span style="${c.is_used?'text-decoration:line-through;color:#94a3b8':'color:#0f172a;font-weight:bold'}">${esc(c.code)}</span><span style="font-size:10px;padding:2px 6px;border-radius:4px;${c.is_used?'background:#fee2e2;color:#ef4444':'background:#d1fae5;color:#047857'}">${c.is_used?'Used':'Active'}</span></div>`).join('')||'<p style="font-size:12px;color:#64748b">Babu code.</p>';}}

          async function renderNotices(){const notices=state.notices;const unread=notices.filter(n=>n.unread).length;$('noticeBadgeCount').innerText=unread;$('noticeBadgeCount').style.display=unread?'inline-block':'none';$('noticeListContainer').innerHTML=notices.map(n=>`<div class="notice-item ${n.unread?'unread':''}" onclick="markNotice(${n.id})"><div><div style="font-weight:bold;color:var(--primary);font-size:13.5px">${esc(n.title)}</div><div style="font-size:12px;color:#475569;margin-top:2px">${esc(n.message)}</div></div><div class="notice-actions"><button class="notice-btn" style="background:#ef4444" onclick="event.stopPropagation();deleteNotice(${n.id})">✕</button></div></div>`).join('')||'<p style="padding:15px;text-align:center;color:#64748b;font-size:12px">Babu sanarwa.</p>';}
          async function markNotice(id){const {error}=await supabaseClient.from('notices').update({unread:false}).eq('id',id);if(error)return alert(error.message);await loadDashboardData();}
          async function deleteNotice(id){const {error}=await supabaseClient.from('notices').delete().eq('id',id);if(error)return alert(error.message);await loadDashboardData();}
          $('markAllNoticesBtn').addEventListener('click',async e=>{e.stopPropagation();const {error}=await supabaseClient.from('notices').update({unread:false}).eq('is_active',true);if(error)alert(error.message);else loadDashboardData();});
          $('delAllNoticesBtn').addEventListener('click',async e=>{e.stopPropagation();if(!confirm('Tabbas ka amince ka goge duk sanarwa?'))return;const {error}=await supabaseClient.from('notices').delete().eq('is_active',true);if(error)alert(error.message);else loadDashboardData();});

          async function openStudentModal(id){const s=state.students.find(x=>x.userId===id);if(!s)return;state.selectedStudentId=s.id;$('modalStudentId').innerText=s.userId;$('modalStudentName').innerText=`${s.firstName} ${s.lastName}`;$('modalStudentClass').innerText=s.section;$('modalStudentGender').innerText=s.gender||'N/A';$('modalStudentEmail').innerText=s.email||'N/A';$('modalStudentCode').innerText=s.usedCode||'N/A';$('modalStudentPhone').innerText=s.phone;$('modalStudentAddress').innerText=s.address||'';$('modalStudentTime').innerText=s.time;$('modalStudentDate').innerText=s.date;$('studentModal').style.display='flex';}
          $('closeStudentModalBtn').addEventListener('click',()=>{$('studentModal').style.display='none';});
          $('deleteStudentBtn').addEventListener('click',async()=>{if(!state.selectedStudentId||!confirm('Tabbas kana son goge wannan dalibin?'))return;const s=state.students.find(x=>x.id===state.selectedStudentId);if(!s)return;const {error:pe}=await supabaseClient.from('payments').delete().eq('student_id',s.id);if(pe)return alert(pe.message);const {error}=await supabaseClient.from('students').delete().eq('id',s.id);if(error)return alert(error.message);if(s.passport)await supabaseClient.storage.from('student-passports').remove([s.passport]);await logActivity('delete_student','student',String(s.id),{user_id:s.userId});$('studentModal').style.display='none';await loadDashboardData();});

          async function renderFormsList(){const q=($('formsSearchInput').value||'').toLowerCase();const list=state.students.filter(s=>(state.currentFormFilter==='ALL'||s.section===state.currentFormFilter)&&(s.userId.toLowerCase().includes(q)||`${s.firstName} ${s.lastName}`.toLowerCase().includes(q)));$('formsListContainer').innerHTML=list.map(s=>`<div style="background:#fff;border:1px solid #cbd5e1;padding:12px 18px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center"><div><strong style="color:var(--primary)">${esc(s.userId)}</strong> - ${esc(s.firstName)} ${esc(s.lastName)} (${esc(s.section)})</div><button type="button" onclick="openAdminFormView(decodeURIComponent('${encodeURIComponent(s.userId)}'))" style="background:var(--secondary);color:#fff;padding:6px 14px;font-size:12px;margin:0;width:auto">View Form</button></div>`).join('')||'<p style="color:#64748b;font-size:13px">Babu fofannin rajista.</p>';}
