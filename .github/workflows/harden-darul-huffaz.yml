          async function openAdminFormView(id){const s=state.students.find(x=>x.userId===id);if(!s)return;for(const [el,val] of [['adminFormFirstName',s.firstName],['adminFormLastName',s.lastName],['adminFormUserId',s.userId],['adminFormPhone',s.phone],['adminFormAddress',s.address],['adminFormEmail',s.email||'N/A'],['adminFormSection',s.section],['adminStudentSigLine',`${s.firstName} ${s.lastName}`],['adminFormDate1',s.date],['adminFormDate2',s.date]])$(el).innerText=val||'';const p=$('adminFormPassportBox');p.innerHTML='PHOTO';if(s.passport){const {data,error}=await supabaseClient.storage.from('student-passports').createSignedUrl(s.passport,600);if(!error&&data?.signedUrl)p.innerHTML=`<img src="${data.signedUrl}" alt="Passport">`;}$('formViewModal').style.display='flex';}
