name: Install Darul Huffaz hardcoded admin auth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-admin-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject admin auth controller
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="admin-hardcoded-auth.js"></script>'
          if tag not in s:
              marker = '<script src="code-generator.js"></script>'
              if marker in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
              else:
                  s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit injected script tag
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Admin auth script already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire hardcoded admin auth controller"
          git push
