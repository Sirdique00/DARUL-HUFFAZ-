name: Darul Huffaz Camera Final Fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/camera-final-fix.yml'
permissions:
  contents: write
jobs:
  repair-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only live camera
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""          function openLiveCamera(){ $('cameraModal').style.display='flex'; startCameraStream(); }
          function startCameraStream(){ if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop()); navigator.mediaDevices.getUserMedia({video:{facingMode:usingFrontCamera?'user':'environment'},audio:false}).then(s=>{mediaStream=s;$('liveVideoElement').srcObject=s;}).catch(e=>{alert('An samu matsala wajen bude camera: '+e.message);$('cameraModal').style.display='none';}); }
"""
          new="""          async function openLiveCamera(){
              $('cameraModal').style.display='flex';
              const ok=await startCameraStream();
              if(!ok){ $('cameraModal').style.display='none'; }
          }
          async function startCameraStream(){
              if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
              const video=$('liveVideoElement');
              if(!navigator.mediaDevices?.getUserMedia){ alert('Wannan browser baya bada damar Live Camera. Yi amfani da Chrome ko browser mai HTTPS.'); return false; }
              video.pause(); video.srcObject=null;
              const wanted=usingFrontCamera?'user':'environment';
              try{
                  mediaStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:wanted},width:{ideal:1280},height:{ideal:960}},audio:false});
              }catch(e){
                  try{
                      mediaStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:wanted},audio:false});
                  }catch(e2){
                      mediaStream=null;
                      alert('An kasa bude Camera. Ka tabbatar ka ba browser izinin Camera sannan ka sake gwadawa.');
                      return false;
                  }
              }
              video.srcObject=mediaStream;
              video.setAttribute('playsinline','');
              video.muted=true;
              try{ await video.play(); }catch(e){}
              return true;
          }
"""
          if old not in s:
              raise SystemExit('Camera block not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          old2="""          $('switchCameraBtn').addEventListener('click',()=>{usingFrontCamera=!usingFrontCamera;startCameraStream();});
          $('captureCancelBtn').addEventListener('click',()=>{if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());$('cameraModal').style.display='none';});
          $('captureGoodBtn').addEventListener('click',()=>{const v=$('liveVideoElement'),c=document.createElement('canvas');c.width=v.videoWidth||600;c.height=v.videoHeight||800;c.getContext('2d').drawImage(v,0,0,c.width,c.height);processAndSetImage(c.toDataURL('image/jpeg',0.76));if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop());$('cameraModal').style.display='none';});
"""
          new2="""          $('switchCameraBtn').addEventListener('click',async()=>{
              const btn=$('switchCameraBtn');
              btn.disabled=true;
              usingFrontCamera=!usingFrontCamera;
              const ok=await startCameraStream();
              if(!ok) usingFrontCamera=!usingFrontCamera;
              btn.disabled=false;
          });
          $('captureCancelBtn').addEventListener('click',()=>{
              if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
              $('liveVideoElement').srcObject=null;
              $('cameraModal').style.display='none';
          });
          $('captureGoodBtn').addEventListener('click',()=>{
              const v=$('liveVideoElement');
              if(!mediaStream || !v.videoWidth || !v.videoHeight){ alert('Camera bai shirya ba tukuna. Jira kadan sannan ka sake taba Good.'); return; }
              const c=document.createElement('canvas');
              c.width=v.videoWidth; c.height=v.videoHeight;
              c.getContext('2d').drawImage(v,0,0,c.width,c.height);
              processAndSetImage(c.toDataURL('image/jpeg',0.76));
              if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
              v.srcObject=null;
              $('cameraModal').style.display='none';
          });
"""
          if old2 not in s:
              raise SystemExit('Camera controls block not found; refusing unsafe edit')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify only intended camera changes and full frontend integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['cameraModal','liveVideoElement','switchCameraBtn','captureGoodBtn','captureCancelBtn','openLiveCamera','startCameraStream','usingFrontCamera']
          for x in required:
              assert x in s, 'missing camera feature: '+x
          assert 'facingMode:{exact:wanted}' in s
          assert 'facingMode:wanted' in s
          assert "getUserMedia" in s
          assert "video.play()" in s
          assert 'if(!mediaStream || !v.videoWidth || !v.videoHeight)' in s
          assert "https://jdjxlfaabzxmwbgxduwr.supabase.co" in s
          assert "sb_publishable_9s82QdwtrnBiaF-lVyLH1A_N0zTn46-" in s
          for bad in ('localStorage','sessionStorage','__dhMemoryStorage','sb_publishable__XP-1m___1AaPk8gbfCkyA_NA-87Tjw','aobizjaqoctzbmzmpvrz.supabase.co'):
              assert bad not in s, 'legacy reference found: '+bad
          assert "select('student_id,amount,paid_at,status')" in s
          ids=set(re.findall(r'id=[\"\']([^\"\']+)[\"\']',s))
          used=set(re.findall(r"\$\(['\"]([^'\"]+)['\"]\)",s)) | set(re.findall(r"getElementById\(['\"]([^'\"]+)['\"]\)",s))
          missing=sorted(x for x in used if x not in ids)
          if missing: raise SystemExit('Missing DOM ids: '+', '.join(missing))
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix live camera front back switching and capture'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/camera-final-fix.yml
          git add .github/workflows/camera-final-fix.yml
          git commit -m 'Remove temporary camera fix workflow' || true
          git push || true
