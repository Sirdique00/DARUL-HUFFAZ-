name: Repair migration patcher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[repair-migration]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix replacement callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/harden-darul-huffaz.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("new_html, n = re.subn(pattern, js, html, count=1, flags=re.S)", "new_html, n = re.subn(pattern, lambda _m: js, html, count=1, flags=re.S)")
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/harden-darul-huffaz.yml
          git commit -m 'Repair migration patcher [repair-migration]'
          git push