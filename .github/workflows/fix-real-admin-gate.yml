name: Fix hidden admin gate to direct login
on:
  push:
    paths:
      - '.github/workflows/fix-real-admin-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply direct Login gate
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove any previous hidden-gate script so only one gate exists.
          s=re.sub(r'<script>\s*/\*\s*DH_HIDDEN_ADMIN_GATE_[^*]*\*/.*?</script>\s*', '', s, flags=re.S)

          # Remove the old standalone PIN page if it still exists.
          s=re.sub(r'<!-- 6\. ADMIN PIN & LOGIN PAGES -->\s*<div id="pinPage".*?</div>\s*\n\s*<div id="loginPage"', '<!-- 6. ADMIN LOGIN PAGE -->\n<div id="loginPage"', s, count=1, flags=re.S)
          s=s.replace('<div class="form-group"><label>Username *</label><input type="text" id="adminUser" placeholder="Username"></div>', '<div class="form-group"><label>Email Address *</label><input type="email" id="adminUser" autocomplete="username" placeholder="admin@example.com"></div>')
          s=s.replace("function handleLoginBack(){ $('adminUser').value=''; $('adminPass').value=''; showPage('pinPage'); }", "function handleLoginBack(){ $('adminUser').value=''; $('adminPass').value=''; showPage('welcomePage'); }")
          s=s.replace("function handlePinBack(){ $('adminPin').value=''; showPage('welcomePage'); }", "")

          # Remove old direct PIN verification handler if present.
          s=re.sub(r"\s*\$\('verifyPinBtn'\)\.addEventListener\([^;]*;", '', s, count=1, flags=re.S)

          gate=r'''<script>
          /* DH_HIDDEN_ADMIN_GATE_V3_DIRECT_LOGIN */
          (() => {
            const REQUIRED_DOUBLES = 8;
            let doubles = 0;
            let lastTouch = 0;
            let resetTimer = null;
            let opened = false;
            let gateApproved = false;
            const schoolName = 'darul huffaz online academy';
            const norm = v => String(v || '').replace(/\s+/g,' ').trim().toLowerCase();

            function findSchoolTitle(){
              for(const el of document.querySelectorAll('h1,h2,h3,h4,div,p,span,a')){
                if(norm(el.textContent).includes(schoolName)) return el;
              }
              return null;
            }
            function reset(){ doubles=0; lastTouch=0; clearTimeout(resetTimer); }
            function scheduleReset(){ clearTimeout(resetTimer); resetTimer=setTimeout(reset,1800); }
            function getLoginPage(){ return document.getElementById('loginPage'); }
            function hideLogin(){ const page=getLoginPage(); if(page && !gateApproved) page.style.display='none'; }
            function revealLogin(){
              const page=getLoginPage();
              if(!page) return;
              gateApproved=true;
              page.style.display='block';
              page.classList.add('active-page');
              const email=document.getElementById('adminUser');
              if(email) setTimeout(()=>email.focus(),80);
            }
            function showDirectLogin(){ if(opened) return; opened=true; reset(); revealLogin(); }

            function bind(){
              const el=findSchoolTitle();
              if(!el || el.dataset.dhGateV3) return;
              el.dataset.dhGateV3='1';
              el.style.userSelect='none';
              el.style.webkitUserSelect='none';
              el.addEventListener('dblclick',e=>{
                e.preventDefault();
                doubles++;
                if(doubles>=REQUIRED_DOUBLES) showDirectLogin();
                else scheduleReset();
              });
              el.addEventListener('pointerup',e=>{
                if(e.pointerType!=='touch') return;
                const now=Date.now();
                if(now-lastTouch<=450){
                  doubles++;
                  if(doubles>=REQUIRED_DOUBLES) showDirectLogin();
                  else scheduleReset();
                }else scheduleReset();
                lastTouch=now;
              });
            }
            function init(){ bind(); hideLogin(); }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
            const observer=new MutationObserver(()=>{ bind(); if(!gateApproved) hideLogin(); });
            observer.observe(document.body,{subtree:true,childList:true});
            setInterval(bind,1000);
          })();
          </script>'''

          if 'DH_HIDDEN_ADMIN_GATE_V3_DIRECT_LOGIN' not in s:
              pos=s.rfind('</body>')
              if pos < 0: raise SystemExit('Closing body tag not found')
              s=s[:pos]+gate+'\n'+s[pos:]

          p.write_text(s,encoding='utf-8')
          PY

          grep -q 'DH_HIDDEN_ADMIN_GATE_V3_DIRECT_LOGIN' index.html
          ! grep -q 'id="pinPage"' index.html
          ! grep -q 'id="adminPin"' index.html
          ! grep -q 'verify-admin-gate' index.html
          grep -q 'id="loginPage"' index.html
          grep -q 'id="adminUser"' index.html
          grep -q 'id="adminPass"' index.html
          grep -q 'REQUIRED_DOUBLES = 8' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/darul-huffaz-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/darul-huffaz-inline.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Open admin Login directly after 8 double-touch gate'
            git push
          fi
