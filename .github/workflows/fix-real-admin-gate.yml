name: Change hidden admin gate to direct login
on:
  push:
    paths:
      - '.github/workflows/fix-real-admin-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace PIN page and hidden gate
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove the old visible PIN page completely. Login remains the only admin form.
          s=re.sub(r'<!-- 6\. ADMIN PIN & LOGIN PAGES -->\s*<div id="pinPage".*?</div>\s*\n\s*<div id="loginPage"', '<!-- 6. ADMIN LOGIN PAGE -->\n<div id="loginPage"', s, count=1, flags=re.S)

          # Remove old PIN/login back-navigation handlers if present.
          s=s.replace("          function handlePinBack(){ $('adminPin').value=''; showPage('welcomePage'); }\n", "")
          s=s.replace("          function handleLoginBack(){ $('adminUser').value=''; $('adminPass').value=''; showPage('pinPage'); }\n", "          function handleLoginBack(){ $('adminUser').value=''; $('adminPass').value=''; showPage('welcomePage'); }\n")

          # Make the login form email + password only.
          s=s.replace('<div class="form-group"><label>Username *</label><input type="text" id="adminUser" placeholder="Username"></div>', '<div class="form-group"><label>Email Address *</label><input type="email" id="adminUser" autocomplete="username" placeholder="admin@example.com"></div>')
          s=s.replace('<button type="button" onclick="handleLoginBack()" style="background: #64748b; color: white; box-shadow: none; margin-top: 10px;">Soke</button>', '<button type="button" onclick="handleLoginBack()" style="background: #64748b; color: white; box-shadow: none; margin-top: 10px;">Soke</button>', 1)

          marker_start=s.find('          /* DH_HIDDEN_ADMIN_GATE_V2 */')
          if marker_start < 0:
              marker_start=s.find('          /* DH_HIDDEN_ADMIN_GATE_V1 */')
          if marker_start < 0:
              raise SystemExit('Hidden admin gate marker not found')
          script_start=s.rfind('<script>',0,marker_start)
          script_end=s.find('</script>',marker_start)
          if script_start < 0 or script_end < 0:
              raise SystemExit('Gate script boundaries not found')

          code=r'''<script>
          /* DH_HIDDEN_ADMIN_GATE_V3_DIRECT_LOGIN */
          (() => {
            const REQUIRED_DOUBLES = 8;
            let doubles = 0;
            let lastTouch = 0;
            let resetTimer = null;
            let opened = false;
            let gateApproved = false;
            const schoolName = 'darul huffaz online academy';
            const norm = v => String(v || '').replace(/\s+/g,' ').trim().toLowerCase();

            function findSchoolTitle(){
              for(const el of document.querySelectorAll('h1,h2,h3,h4,div,p,span,a')){
                if(norm(el.textContent).includes(schoolName)) return el;
              }
              return null;
            }

            function reset(){
              doubles=0;
              lastTouch=0;
              clearTimeout(resetTimer);
            }

            function scheduleReset(){
              clearTimeout(resetTimer);
              resetTimer=setTimeout(reset,1800);
            }

            function getLoginPage(){
              const form=document.getElementById('adminUser')?.closest('.page');
              return form || document.getElementById('loginPage');
            }

            function hideLogin(){
              const page=getLoginPage();
              if(page && !gateApproved) page.style.display='none';
            }

            function revealLogin(){
              const page=getLoginPage();
              if(!page) return;
              gateApproved=true;
              page.style.display='block';
              page.classList.add('active-page');
              const email=document.getElementById('adminUser');
              if(email) setTimeout(()=>email.focus(),80);
            }

            function showDirectLogin(){
              if(opened) return;
              opened=true;
              reset();
              revealLogin();
            }

            function bind(){
              const el=findSchoolTitle();
              if(!el || el.dataset.dhGateV3) return;
              el.dataset.dhGateV3='1';
              el.style.userSelect='none';
              el.style.webkitUserSelect='none';
              el.addEventListener('dblclick',e=>{
                e.preventDefault();
                doubles++;
                if(doubles>=REQUIRED_DOUBLES) showDirectLogin();
                else scheduleReset();
              });
              el.addEventListener('pointerup',e=>{
                if(e.pointerType!=='touch') return;
                const now=Date.now();
                if(now-lastTouch<=450){
                  doubles++;
                  if(doubles>=REQUIRED_DOUBLES) showDirectLogin();
                  else scheduleReset();
                }else{
                  scheduleReset();
                }
                lastTouch=now;
              });
            }

            function init(){
              bind();
              hideLogin();
            }

            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
            else init();

            const observer=new MutationObserver(()=>{
              bind();
              if(!gateApproved) hideLogin();
            });
            observer.observe(document.body,{subtree:true,childList:true});
            setInterval(bind,1000);
          })();
          </script>'''

          s=s[:script_start]+code+s[script_end+9:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'DH_HIDDEN_ADMIN_GATE_V3_DIRECT_LOGIN' index.html
          ! grep -q 'verify-admin-gate' index.html
          ! grep -q 'id="pinPage"' index.html
          ! grep -q 'id="adminPin"' index.html
          grep -q 'id="loginPage"' index.html
          grep -q 'id="adminUser"' index.html
          grep -q 'id="adminPass"' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Open admin login directly after hidden 8 double-touch gate'
          git push
