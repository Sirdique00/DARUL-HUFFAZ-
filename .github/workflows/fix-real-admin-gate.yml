name: Finalize hidden admin access
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final admin cleanup and verify
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          marker='<!-- 6. ADMIN PIN & LOGIN PAGES -->'
          login_marker='<div id="loginPage"'
          if marker in s and login_marker in s:
              a=s.index(marker); b=s.index(login_marker,a)
              s=s[:a]+'<!-- 6. ADMIN LOGIN PAGE -->\n'+s[b:]

          # Remove all old hidden gate scripts and PIN auth injector.
          s=re.sub(r'<script>\s*/\*\s*DH_HIDDEN_ADMIN_GATE_[^*]*\*/.*?</script>\s*', '', s, flags=re.S)
          s=re.sub(r'<script>\s*/\*\s*DH_SUPABASE_ADMIN_AUTH_V1\s*\*/.*?</script>\s*', '', s, flags=re.S)
          s=re.sub(r'\n?\s*function handlePinBack\(\)\{.*?\}\s*', '\n', s, count=1, flags=re.S)
          s=s.replace("function handleLoginBack(){ $('adminUser').value=''; $('adminPass').value=''; showPage('pinPage'); }", "function handleLoginBack(){ $('adminUser').value=''; $('adminPass').value=''; showPage('welcomePage'); }")
          s=re.sub(r"\n?\s*\$\('verifyPinBtn'\)\.addEventListener\(.*?\);", '', s, count=1, flags=re.S)

          # Remove the complete existing login handler by stable neighboring markers.
          start_token="          $('verifyLoginBtn').addEventListener('click',async()=>{"
          end_token="\n\n          $('logoutBtn')"
          if start_token not in s: raise SystemExit('Login handler anchor missing')
          a=s.index(start_token); b=s.index(end_token,a)
          login="""          $('verifyLoginBtn').addEventListener('click',async()=>{
              const email=$('adminUser').value.trim().toLowerCase();
              const password=$('adminPass').value;
              if(!email||!password)return alert('Sanya Admin Email da Password.');
              const btn=$('verifyLoginBtn'); btn.disabled=true; btn.innerText='Ana tabbatarwa...';
              try{
                  const signed=await supabaseClient.auth.signInWithPassword({email,password});
                  if(signed.error){
                      const sign=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:email.split('@')[0]}}});
                      if(sign.error)throw signed.error;
                      if(!sign.data.session){
                          alert('An kirkiri account. Duba email dinka ka tabbatar, sannan ka dawo ka Login.');
                          return;
                      }
                      const boot=await supabaseClient.functions.invoke('bootstrap-admin',{body:{fullName:email.split('@')[0]}});
                      if(boot.error||!boot.data?.success)throw new Error(boot.data?.error||boot.error?.message||'ADMIN_SETUP_FAILED');
                  }
                  const admin=await ensureAdmin();
                  if(!admin)throw new Error('Wannan account ba Admin bane.');
                  $('adminWelcomeUser').innerText=`Admin: ${admin.full_name}`;
                  setupSupabaseRealtime();
                  showPage('adminDashboard');
              }catch(err){
                  console.error(err);
                  await supabaseClient.auth.signOut({scope:'local'}).catch(()=>{});
                  alert('Login ya kasa: '+(err.message||err));
              }finally{btn.disabled=false;btn.innerText='Login ➔';}
          });"""
          s=s[:a]+login+s[b:]

          # Remove every leftover PIN identifier/reference from frontend code.
          s=re.sub(r"\n?[^\n]*\$\('verifyPinBtn'\)[^\n]*", '', s)
          s=re.sub(r"\n?[^\n]*\$\('pinPage'\)[^\n]*", '', s)
          s=re.sub(r"\n?[^\n]*\$\('adminPin'\)[^\n]*", '', s)
          s=re.sub(r"\n?[^\n]*\$\('adminLoginPin'\)[^\n]*", '', s)

          gate=r'''<script>
          /* DH_HIDDEN_ADMIN_GATE_FINAL */
          (() => {
            const REQUIRED_DOUBLES = 8;
            let doubles=0,lastTouch=0,resetTimer=null,opened=false,gateApproved=false;
            const schoolName='darul huffaz online academy';
            const norm=v=>String(v||'').replace(/\s+/g,' ').trim().toLowerCase();
            function findSchoolTitle(){for(const el of document.querySelectorAll('h1,h2,h3,h4,div,p,span,a')){if(norm(el.textContent).includes(schoolName))return el;}return null;}
            function reset(){doubles=0;lastTouch=0;clearTimeout(resetTimer);}
            function scheduleReset(){clearTimeout(resetTimer);resetTimer=setTimeout(reset,1800);}
            function hideLogin(){const page=document.getElementById('loginPage');if(page&&!gateApproved)page.style.display='none';}
            function revealLogin(){const page=document.getElementById('loginPage');if(!page)return;gateApproved=true;page.style.display='block';page.classList.add('active-page');setTimeout(()=>document.getElementById('adminUser')?.focus(),80);}
            function openLogin(){if(opened)return;opened=true;reset();revealLogin();}
            function bind(){
              const el=findSchoolTitle(); if(!el||el.dataset.dhFinalGate)return;
              el.dataset.dhFinalGate='1';el.style.userSelect='none';el.style.webkitUserSelect='none';
              el.addEventListener('dblclick',e=>{e.preventDefault();doubles++;if(doubles>=REQUIRED_DOUBLES)openLogin();else scheduleReset();});
              el.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')return;const now=Date.now();if(now-lastTouch<=450){doubles++;if(doubles>=REQUIRED_DOUBLES)openLogin();else scheduleReset();}else scheduleReset();lastTouch=now;});
            }
            function init(){bind();hideLogin();}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
            new MutationObserver(()=>{bind();hideLogin();}).observe(document.body,{subtree:true,childList:true});
            setInterval(bind,1000);
          })();
          </script>'''
          s=s.replace('</body>',gate+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

          ! grep -q 'id="pinPage"' index.html
          ! grep -q 'id="adminPin"' index.html
          ! grep -q 'id="adminLoginPin"' index.html
          ! grep -q 'verify-admin-gate' index.html
          ! grep -q 'verify-admin-pin' index.html
          ! grep -q 'DH_SUPABASE_ADMIN_AUTH_V1' index.html
          ! grep -q 'DH_HIDDEN_ADMIN_GATE_V2' index.html
          ! grep -q 'DH_HIDDEN_ADMIN_GATE_V3' index.html
          grep -q 'DH_HIDDEN_ADMIN_GATE_FINAL' index.html
          grep -q 'REQUIRED_DOUBLES = 8' index.html
          grep -q 'id="loginPage"' index.html
          grep -q 'id="adminUser"' index.html
          grep -q 'id="adminPass"' index.html
          grep -q 'signInWithPassword' index.html
          grep -q 'bootstrap-admin' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/darul-huffaz-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/darul-huffaz-inline.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize admin login without PIN'
            git push
          fi
