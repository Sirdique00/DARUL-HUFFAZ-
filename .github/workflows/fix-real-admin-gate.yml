name: Finalize hardcoded admin access
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hardcoded admin login
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove old PIN pages/gates and old Supabase Auth login handlers.
          s=re.sub(r'<script>\s*/\*\s*DH_HIDDEN_ADMIN_GATE_[^*]*\*/.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<script>\s*/\*\s*DH_SUPABASE_ADMIN_AUTH_V1\s*\*/.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'\s*<div id="pinPage".*?</div>\s*','\n',s,count=1,flags=re.S)
          s=re.sub(r'\n?\s*\$\(\'verifyPinBtn\'\).*?;','',s,count=1,flags=re.S)
          s=re.sub(r'\n?\s*function handlePinBack\(\).*?\}\s*','\n',s,count=1,flags=re.S)
          s=s.replace("function handleLoginBack(){ $('adminUser').value=''; $('adminPass').value=''; showPage('pinPage'); }", "function handleLoginBack(){ $('adminUser').value=''; $('adminPass').value=''; $('adminPin').value=''; showPage('welcomePage'); }")

          # Ensure login page has username/password/PIN fields.
          login_pat=r'(<div id="loginPage" class="page auth-container">.*?<h2>Admin Login</h2>).*?(<button type="button" id="verifyLoginBtn">)'
          login_repl=r'''\1
    <div class="form-group"><label>Username *</label><input type="text" id="adminUser" placeholder="Username" autocomplete="username"></div>
    <div class="form-group"><label>Password *</label><input type="password" id="adminPass" placeholder="Password" autocomplete="current-password"></div>
    <div class="form-group"><label>Admin PIN *</label><input type="password" id="adminPin" placeholder="PIN" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    \2'''
          s,n=re.subn(login_pat,login_repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Login page anchor missing')

          # Replace the current login handler with the hardcoded credential gateway.
          start="          $('verifyLoginBtn').addEventListener('click',async()=>{"
          end="\n\n          $('logoutBtn')"
          if start not in s: raise SystemExit('Login handler anchor missing')
          a=s.index(start); b=s.index(end,a)
          login="""          $('verifyLoginBtn').addEventListener('click',async()=>{
              const username=$('adminUser').value.trim();
              const password=$('adminPass').value;
              const pin=$('adminPin').value.trim();
              if(!username||!password||!pin)return alert('Sanya Username, Password da PIN.');
              const btn=$('verifyLoginBtn');btn.disabled=true;btn.innerText='Ana tabbatarwa...';
              try{
                  const result=await supabaseClient.functions.invoke('admin-hardcoded-login',{body:{username,password,pin}});
                  if(result.error)throw result.error;
                  if(!result.data?.success||!result.data?.session)throw new Error(result.data?.error||'LOGIN_FAILED');
                  const sessionResult=await supabaseClient.auth.setSession(result.data.session);
                  if(sessionResult.error)throw sessionResult.error;
                  const admin=await ensureAdmin();
                  if(!admin)throw new Error('Admin profile bai samu ba.');
                  $('adminWelcomeUser').innerText=`Admin: ${admin.full_name}`;
                  setupSupabaseRealtime();
                  showPage('adminDashboard');
              }catch(err){
                  console.error(err);
                  await supabaseClient.auth.signOut({scope:'local'}).catch(()=>{});
                  alert('Login ya kasa: '+(err.message||err));
              }finally{btn.disabled=false;btn.innerText='Login ➔';}
          });"""
          s=s[:a]+login+s[b:]

          # Final hidden gesture: 8 double-touches/double-clicks on the academy name, then direct login.
          gate=r'''<script>
          /* DH_HARDCODED_ADMIN_GATE_FINAL */
          (()=>{
            const REQUIRED_DOUBLES=8;let doubles=0,lastTouch=0,resetTimer=null,opened=false,approved=false;
            const schoolName='darul huffaz online academy';
            const norm=v=>String(v||'').replace(/\s+/g,' ').trim().toLowerCase();
            function findTitle(){for(const el of document.querySelectorAll('h1,h2,h3,h4,div,p,span,a'))if(norm(el.textContent).includes(schoolName))return el;return null;}
            function reset(){doubles=0;lastTouch=0;clearTimeout(resetTimer);}
            function tick(){clearTimeout(resetTimer);resetTimer=setTimeout(reset,1800);}
            function hide(){const p=document.getElementById('loginPage');if(p&&!approved)p.style.display='none';}
            function reveal(){const p=document.getElementById('loginPage');if(!p)return;approved=true;p.style.display='block';p.classList.add('active-page');setTimeout(()=>document.getElementById('adminUser')?.focus(),80);}
            function open(){if(opened)return;opened=true;reset();reveal();}
            function bind(){const el=findTitle();if(!el||el.dataset.dhHardGate)return;el.dataset.dhHardGate='1';el.style.userSelect='none';el.addEventListener('dblclick',e=>{e.preventDefault();doubles++;if(doubles>=REQUIRED_DOUBLES)open();else tick();});el.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')return;const now=Date.now();if(now-lastTouch<=450){doubles++;if(doubles>=REQUIRED_DOUBLES)open();else tick();}else tick();lastTouch=now;});}
            function init(){bind();hide();}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
            new MutationObserver(()=>{bind();hide();}).observe(document.body,{subtree:true,childList:true});
            setInterval(bind,1000);
          })();
          </script>'''
          s=s.replace('</body>',gate+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

          ! grep -q 'id="pinPage"' index.html
          ! grep -q 'verifyPinBtn' index.html
          ! grep -q 'adminLoginPin' index.html
          ! grep -q 'DH_SUPABASE_ADMIN_AUTH_V1' index.html
          ! grep -q 'DH_HIDDEN_ADMIN_GATE_FINAL' index.html
          grep -q 'DH_HARDCODED_ADMIN_GATE_FINAL' index.html
          grep -q 'REQUIRED_DOUBLES=8' index.html
          grep -q 'id="adminPin"' index.html
          grep -q "admin-hardcoded-login" index.html
          grep -q "setSession(result.data.session)" index.html

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/darul-huffaz-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/darul-huffaz-inline.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Use hardcoded admin credentials with Supabase audit session'
            git push
          fi
